<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>RAG Moderation — Options</title>
    <link rel="stylesheet" href="options.css" />
  </head>
  <body>
    <h1>Options</h1>
    <p class="muted">API calls go to Community Moderation Tool Universal (<code>/api/moderate</code> with the RAG provider). Secrets stay on the server.</p>

    <section>
      <h2>Environment</h2>
      <label for="env-profile">Profile</label>
      <select id="env-profile">
        <option value="local">Local dev (127.0.0.1:3001)</option>
        <option value="production">Production (airesearchdog.net)</option>
        <option value="custom">Custom origin</option>
      </select>

      <label for="custom-origin">Custom API origin (https://host, no path)</label>
      <input id="custom-origin" type="url" placeholder="https://example.com" disabled />

      <button type="button" id="grant-permission" class="secondary">Grant host permission for current origin</button>
      <p id="permission-status" class="muted"></p>
    </section>

    <section>
      <h2>Moderation identity (dev)</h2>
      <label for="moderator-id">moderatorId</label>
      <input id="moderator-id" type="text" />
      <label for="device-id">deviceId</label>
      <input id="device-id" type="text" />
      <label for="rag-provider">RAG provider id</label>
      <input id="rag-provider" type="text" />
    </section>

    <section>
      <h2>Feed location</h2>
      <label for="opt-location">userLocation</label>
      <input id="opt-location" type="text" />
      <div class="actions">
        <button type="button" id="save" class="primary">Save</button>
        <button type="button" id="reset-location" class="danger">Reset location (show first-run dialog)</button>
      </div>
      <p id="save-status" class="status muted" aria-live="polite"></p>
    </section>

    <script type="module" src="options.js"></script>
  </body>
</html>
