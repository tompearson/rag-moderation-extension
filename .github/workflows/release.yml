name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Build store package
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
        run: |
          RELEASE_VERSION="${RELEASE_VERSION#v}"
          export RELEASE_VERSION
          npm run package:store
          npm run verify:store-zip

      - name: Prepare versioned ZIP asset
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          ZIP="dist/rag-moderation-assistant-${VERSION}.zip"
          cp dist/rag-moderation-assistant.zip "$ZIP"
          sha256sum "$ZIP" | tee dist/release-sha256.txt

      - name: Write release notes
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: node scripts/write-github-release-body.mjs

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          body_path: dist/RELEASE_BODY.md
          files: dist/rag-moderation-assistant-*.zip

      - name: Email release notification (Resend)
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          RELEASE_NOTIFY_TO: info@airesearchdog.net
        run: node scripts/send-release-notify-email.mjs
