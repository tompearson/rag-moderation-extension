name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Build store package
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
        run: |
          RELEASE_VERSION="${RELEASE_VERSION#v}"
          export RELEASE_VERSION
          npm run package:store
          npm run verify:store-zip

      - name: Prepare versioned ZIP asset
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          cp dist/rag-moderation-assistant.zip "dist/rag-moderation-assistant-${VERSION}.zip"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/rag-moderation-assistant-*.zip
          body: |
            Production **sideload** build for RAG Moderation Assistant.

            ### Install (Chrome / Edge)
            1. Download **rag-moderation-assistant-&lt;version&gt;.zip** below and **unzip** it (manifest.json must be at the top level of the folder).
            2. Open `chrome://extensions` or `edge://extensions`, enable **Developer mode**, click **Load unpacked**, and select that folder.
            3. Pin the toolbar icon if needed — [developer install guide](https://www.airesearchdog.net/extension/install-chrome-extension-developer).
            4. Workflow help: [How to moderate user posts](https://www.airesearchdog.net/extension/how-to-moderate-user-posts).

            This build uses the **Production** API profile (`https://www.airesearchdog.net`) by default.

            [All releases](https://github.com/${{ github.repository }}/releases)
