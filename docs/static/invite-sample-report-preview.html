<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Sample moderation report — RAG Moderation Assistant</title>
    <style>
      :root {
        --preview-footer-space: 7.75rem;
      }

      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        min-height: 100%;
        height: 100%;
        overflow-x: hidden;
        overflow-y: auto;
        background: #e2e8f0;
      }

      body {
        display: flex;
        flex-direction: column;
        align-items: stretch;
        padding-bottom: calc(var(--preview-footer-space) + env(safe-area-inset-bottom, 0px));
      }

      .preview-main {
        flex: 1 1 auto;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 0;
        width: 100%;
        padding: 12px 12px 8px;
        box-sizing: border-box;
      }

      .preview-footer {
        position: fixed;
        left: 0;
        right: 0;
        bottom: 0;
        z-index: 5;
        width: 100%;
        padding: 12px 16px max(14px, env(safe-area-inset-bottom, 0px));
        background: #ffffff;
        border-top: 2px solid #cbd5e1;
        text-align: center;
        font: 14px/1.5 system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        color: #0f172a;
        box-shadow: 0 -8px 24px rgba(15, 23, 42, 0.12);
      }

      .preview-footer p {
        margin: 0 auto;
        max-width: 28rem;
      }

      .preview-footer-lede {
        font-size: 13px;
        color: #0f172a;
        margin-bottom: 8px !important;
      }

      .preview-footer-cta {
        margin-bottom: 6px !important;
      }

      .preview-footer-link {
        display: inline-block;
        padding: 8px 14px;
        border-radius: 999px;
        background: #2563eb;
        color: #ffffff !important;
        font-weight: 700;
        font-size: 14px;
        text-decoration: none;
        box-shadow: 0 2px 6px rgba(37, 99, 235, 0.35);
      }

      .preview-footer-link:hover {
        background: #1d4ed8;
        color: #ffffff !important;
      }

      .preview-footer-link:focus-visible {
        outline: 2px solid #1e40af;
        outline-offset: 2px;
      }

      .preview-footer-detail {
        font-size: 12px;
        line-height: 1.45;
        color: #1e293b;
      }

      .close-btn {
        position: fixed;
        top: max(12px, env(safe-area-inset-top, 0px));
        right: max(12px, env(safe-area-inset-right, 0px));
        z-index: 3;
        width: 44px;
        height: 44px;
        margin: 0;
        padding: 0;
        border: none;
        border-radius: 50%;
        background: rgba(15, 23, 42, 0.65);
        color: #fff;
        font: 28px/1 system-ui, sans-serif;
        cursor: pointer;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
      }

      .close-btn:hover {
        background: rgba(15, 23, 42, 0.85);
      }

      .close-btn:focus-visible {
        outline: 2px solid #fff;
        outline-offset: 2px;
      }

      .shot-link {
        position: relative;
        z-index: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        max-width: min(100%, 420px);
        max-height: calc(100dvh - var(--preview-footer-space) - 32px);
        text-decoration: none;
        cursor: pointer;
        -webkit-tap-highlight-color: rgba(0, 0, 0, 0.1);
      }

      .shot {
        display: block;
        max-width: 100%;
        max-height: calc(100dvh - var(--preview-footer-space) - 32px);
        width: auto;
        height: auto;
        object-fit: contain;
        background: #ffffff;
        border-radius: 8px;
        box-shadow: 0 4px 20px rgba(15, 23, 42, 0.12);
      }
    </style>
  </head>
  <body>
    <button type="button" class="close-btn" id="close" aria-label="Close" title="Close">×</button>
    <div class="preview-main">
      <a
        class="shot-link"
        id="full-report"
        href="https://www.airesearchdog.net/api/get-reports?action=view&amp;id=0e4889a4-ded3-4cc1-ab07-6df4eda43db2&amp;_t=1794354093783&amp;layout=email"
        target="_blank"
        rel="noopener noreferrer"
        title="Open full sample report"
      >
        <img
          class="shot"
          id="full-report-img"
          src="/extension/images/invite-sample-report-screenshot.png"
          alt="Sample RAG Moderation Assistant report showing a Remove decision with reason and breakdown — tap to open full report"
          width="340"
          height="569"
        />
      </a>
    </div>
    <footer class="preview-footer" aria-label="About this sample">
      <p class="preview-footer-lede">The image above is a screenshot preview only.</p>
      <p class="preview-footer-cta">
        <a
          id="full-report-text-link"
          class="preview-footer-link"
          href="https://www.airesearchdog.net/api/get-reports?action=view&amp;id=0e4889a4-ded3-4cc1-ab07-6df4eda43db2&amp;_t=1794354093783&amp;layout=email"
          target="_blank"
          rel="noopener noreferrer"
          >Open full saved moderation report</a
        >
      </p>
      <p class="preview-footer-detail">
        Complete extension result: decision, reasons, breakdown, and retrieved guidelines (same layout as the emailed
        report).
      </p>
    </footer>
    <script>
      const FULL_REPORT_URL =
        'https://www.airesearchdog.net/api/get-reports?action=view&id=0e4889a4-ded3-4cc1-ab07-6df4eda43db2&_t=1794354093783&layout=email';

      function openFullReport(event) {
        if (event) {
          event.preventDefault();
          event.stopPropagation();
        }
        try {
          const opened = window.open(FULL_REPORT_URL, '_blank', 'noopener,noreferrer');
          if (opened) return;
        } catch {
          /* fall through */
        }
        window.location.assign(FULL_REPORT_URL);
      }

      function closePreview() {
        if (window.history.length > 1) {
          window.history.back();
          return;
        }
        window.close();
      }

      document.getElementById('full-report').addEventListener('click', openFullReport);
      document.getElementById('full-report-img').addEventListener('click', openFullReport);
      document.getElementById('close').addEventListener('click', closePreview);
      document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') closePreview();
      });
    </script>
  </body>
</html>
