<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Sample moderation report — RAG Moderation Assistant</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #f3f4f6;
      }

      body {
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .close-btn {
        position: fixed;
        top: max(12px, env(safe-area-inset-top, 0px));
        right: max(12px, env(safe-area-inset-right, 0px));
        z-index: 3;
        width: 44px;
        height: 44px;
        margin: 0;
        padding: 0;
        border: none;
        border-radius: 50%;
        background: rgba(15, 23, 42, 0.65);
        color: #fff;
        font: 28px/1 system-ui, sans-serif;
        cursor: pointer;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
      }

      .close-btn:hover {
        background: rgba(15, 23, 42, 0.85);
      }

      .close-btn:focus-visible {
        outline: 2px solid #fff;
        outline-offset: 2px;
      }

      .shot-link {
        position: relative;
        z-index: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        max-width: 100%;
        max-height: 100vh;
        max-height: 100dvh;
        text-decoration: none;
        cursor: pointer;
        -webkit-tap-highlight-color: rgba(0, 0, 0, 0.1);
      }

      .shot {
        display: block;
        max-width: 100%;
        max-height: 100vh;
        max-height: 100dvh;
        width: auto;
        height: auto;
        object-fit: contain;
      }
    </style>
  </head>
  <body>
    <button type="button" class="close-btn" id="close" aria-label="Close" title="Close">×</button>
    <a
      class="shot-link"
      id="full-report"
      href="https://www.airesearchdog.net/api/get-reports?action=view&amp;id=0e4889a4-ded3-4cc1-ab07-6df4eda43db2&amp;_t=1794354093783&amp;layout=email"
      target="_blank"
      rel="noopener noreferrer"
      title="Open full sample report"
    >
      <img
        class="shot"
        id="full-report-img"
        src="/extension/images/invite-sample-report-screenshot.png"
        alt="Sample RAG Moderation Assistant report showing a Remove decision with reason and breakdown — tap to open full report"
        width="340"
        height="569"
      />
    </a>
    <script>
      const FULL_REPORT_URL =
        'https://www.airesearchdog.net/api/get-reports?action=view&id=0e4889a4-ded3-4cc1-ab07-6df4eda43db2&_t=1794354093783&layout=email';

      function openFullReport(event) {
        if (event) {
          event.preventDefault();
          event.stopPropagation();
        }
        try {
          const opened = window.open(FULL_REPORT_URL, '_blank', 'noopener,noreferrer');
          if (opened) return;
        } catch {
          /* fall through */
        }
        window.location.assign(FULL_REPORT_URL);
      }

      function closePreview() {
        if (window.history.length > 1) {
          window.history.back();
          return;
        }
        window.close();
      }

      document.getElementById('full-report').addEventListener('click', openFullReport);
      document.getElementById('full-report-img').addEventListener('click', openFullReport);
      document.getElementById('close').addEventListener('click', closePreview);
      document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') closePreview();
      });
    </script>
  </body>
</html>
