<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>reCAPTCHA bridge</title>
    <style>
      html,
      body {
        margin: 0;
        width: 1px;
        height: 1px;
        overflow: hidden;
        opacity: 0;
      }
    </style>
    <script src="__RECAPTCHA_SCRIPT_SRC__" async defer></script>
  </head>
  <body>
    <script>
      (function () {
        var SITE_KEY = '__RECAPTCHA_SITE_KEY__';
        var USE_LEGACY = __RECAPTCHA_USE_LEGACY__;
        var ALLOWED_EXTENSION_IDS = __RECAPTCHA_BRIDGE_EXTENSION_IDS_JSON__;
        var TOKEN_TIMEOUT_MS = 22000;
        var requestQueue = [];
        var processing = false;
        var inflightTimer = null;
        var activeJobId = 0;

        function grecaptchaClient() {
          var g = window.grecaptcha;
          if (!g) return null;
          return USE_LEGACY ? g : g.enterprise || g;
        }

        function isAllowedExtensionOrigin(origin) {
          if (typeof origin !== 'string' || !origin.startsWith('chrome-extension://')) {
            return false;
          }
          var id = origin.slice('chrome-extension://'.length).replace(/\/$/, '');
          if (!id) return false;
          if (!Array.isArray(ALLOWED_EXTENSION_IDS) || ALLOWED_EXTENSION_IDS.length === 0) {
            return false;
          }
          return ALLOWED_EXTENSION_IDS.indexOf(id) !== -1;
        }

        function postError(source, origin, message) {
          if (!source || typeof source.postMessage !== 'function') return;
          source.postMessage(
            { type: 'recaptcha-token-error', message: message || 'Token request failed' },
            origin,
          );
        }

        function clearInflightTimer() {
          if (inflightTimer) {
            clearTimeout(inflightTimer);
            inflightTimer = null;
          }
        }

        function finishProcessing() {
          clearInflightTimer();
          processing = false;
          if (requestQueue.length) {
            processNextTokenRequest();
          }
        }

        function processNextTokenRequest() {
          if (processing || !requestQueue.length) return;
          var job = requestQueue.shift();
          if (!job || !job.source) {
            finishProcessing();
            return;
          }
          var action =
            typeof job.action === 'string' && job.action.trim() ? job.action.trim() : 'moderate';
          if (!SITE_KEY) {
            postError(job.source, job.origin, 'reCAPTCHA site key is not configured');
            finishProcessing();
            return;
          }
          processing = true;
          var jobId = ++activeJobId;
          inflightTimer = setTimeout(function () {
            if (jobId !== activeJobId) return;
            postError(job.source, job.origin, 'Token request timed out');
            finishProcessing();
          }, TOKEN_TIMEOUT_MS);
          try {
            var gr = grecaptchaClient();
            if (!gr || !gr.execute) {
              postError(job.source, job.origin, 'reCAPTCHA not loaded');
              finishProcessing();
              return;
            }
            gr.ready(function () {
              if (jobId !== activeJobId) return;
              gr
                .execute(SITE_KEY, { action: action })
                .then(function (token) {
                  if (jobId !== activeJobId) return;
                  job.source.postMessage(
                    { type: 'recaptcha-token', token: token, action: action },
                    job.origin,
                  );
                })
                .catch(function (err) {
                  if (jobId !== activeJobId) return;
                  postError(
                    job.source,
                    job.origin,
                    err && err.message ? err.message : 'grecaptcha.execute failed',
                  );
                })
                .finally(function () {
                  if (jobId !== activeJobId) return;
                  finishProcessing();
                });
            });
          } catch (err) {
            postError(job.source, job.origin, err && err.message ? err.message : 'Bridge error');
            finishProcessing();
          }
        }

        window.addEventListener('message', function (event) {
          if (!isAllowedExtensionOrigin(event.origin)) return;
          var data = event.data;
          if (!data || data.type !== 'recaptcha-token-request') return;
          var action = typeof data.action === 'string' && data.action.trim() ? data.action.trim() : 'moderate';
          requestQueue.push({ source: event.source, origin: event.origin, action: action });
          processNextTokenRequest();
        });
      })();
    </script>
  </body>
</html>
