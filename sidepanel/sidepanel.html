<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>RAG Moderation</title>
    <link rel="stylesheet" href="sidepanel.css" />
    <link rel="stylesheet" href="../lib/statePicker.css" />
  </head>
  <body>
    <div id="location-modal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <div class="modal-card">
        <h2 id="modal-title">Confirm feed location</h2>
        <p class="muted">Moderation uses this state for location alignment (e.g. Oregon feed).</p>
        <label for="modal-location-trigger">Your state</label>
        <div id="modal-location" class="state-picker-host"></div>
        <p id="modal-error" class="error hidden"></p>
        <button type="button" id="modal-save" class="primary">Save and continue</button>
      </div>
    </div>

    <header>
      <div class="header-row">
        <h1>RAG Moderation</h1>
        <button type="button" id="options-btn" class="header-btn">Options</button>
      </div>
      <p id="connection-badge" class="badge muted">Connecting…</p>
    </header>

    <main id="main-panel" class="blocked" aria-hidden="true">
      <label for="user-location-trigger">Feed location</label>
      <div id="user-location" class="state-picker-host"></div>

      <div class="field-header">
        <label for="content">Content to moderate</label>
        <button type="button" id="paste-content-btn" class="small-btn" title="Paste from clipboard">
          Paste
        </button>
      </div>
      <textarea id="content" rows="6" placeholder="Paste post or comment text…"></textarea>

      <details>
        <summary>Post context (beta)</summary>
        <textarea id="post-context" rows="4" placeholder="Original post or thread context for reply moderation…"></textarea>
      </details>

      <div class="row">
        <label for="analysis-type">Analysis</label>
        <select id="analysis-type">
          <option value="quick" selected>Quick</option>
          <option value="detailed">Detailed</option>
        </select>
      </div>

      <div class="row checkbox-row">
        <input id="bad-words-enabled" type="checkbox" checked />
        <label for="bad-words-enabled">Bad Words pre-screen (via Universal)</label>
      </div>

      <div class="actions">
        <button type="button" id="moderate-btn" class="primary">Moderate</button>
        <button type="button" id="clear-btn">Clear content</button>
      </div>

      <div id="moderation-progress" class="moderation-progress hidden" aria-live="polite">
        <span id="moderation-elapsed" class="elapsed">0.0s</span>
        <span id="moderation-limit" class="muted"></span>
        <button type="button" id="abort-moderate-btn" class="small-btn danger-outline" disabled>Stop</button>
      </div>

      <p id="status" class="status muted" aria-live="polite"></p>

      <section id="results" class="results hidden" aria-live="polite"></section>
    </main>

    <script type="module" src="sidepanel.js"></script>
  </body>
</html>
